import { getDatabase, ref, set, get, push, onValue, update, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* =====================================================================
   🔧 FIREBASE CONFIG — Replace with your own project settings
   ===================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyBnI5VSWHCQHZrVbz_tK4SWqG36iaZpwSU",
  authDomain:        "warikan260721.firebaseapp.com",
  databaseURL:       "https://warikan260721-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "warikan260721",
  storageBucket:     "warikan260721.firebasestorage.app",
  messagingSenderId: "1018878258011",
  appId:             "1:1018878258011:web:8ed92f711756bb908b087e"
};
/* ===================================================================== */

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ── Group ID (将来複数グループ対応できるよう /groups/{id}/ 構造) ── */
const GROUP_ID = "default"; // 将来: URLパラメータ等から取得
const gRef = (path) => ref(db, `groups/${GROUP_ID}/${path}`);

/* ── State ── */
let currentUser = null;   // { name, isAdmin }
let config      = {};     // { userPin, adminPin, budget, categories }
let members     = {};     // { id: { name, lastInputAt, lastInputBy } }
let payments    = {};     // { id: { ... } }
let activePage  = "login";
let editPaymentId = null;

/* ══════════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════════ */
async function init() {
  showPage("loading");

  // Firebaseからconfig読み込み
  const snap = await get(gRef("config"));
  if (!snap.exists()) {
    // 初回: デフォルト設定を書き込む
    await set(gRef("config"), {
      userPin:    "1234",
      adminPin:   "1234",
      budget:     0,
      categories: ["その他","宿泊","交通費","食費","コンビニ","観光","お土産"]
    });
  }

  // リアルタイム監視
  onValue(gRef("config"),   snap => { config   = snap.val() || {}; renderAll(); });
  onValue(gRef("members"),  snap => { members  = snap.val() || {}; renderAll(); });
  onValue(gRef("payments"), snap => { payments = snap.val() || {}; renderAll(); });

  // ローカルセッション復元
  const saved = sessionStorage.getItem("sbcUser");
  if (saved) {
    currentUser = JSON.parse(saved);
    showPage("main");
  } else {
    showPage("login");
  }
}

/* ══════════════════════════════════════════════════════════════════════
   PAGE ROUTER
══════════════════════════════════════════════════════════════════════ */
function showPage(page) {
  activePage = page;
  document.querySelectorAll(".page").forEach(el => el.style.display = "none");
  const el = document.getElementById("page-" + page);
  if (el) el.style.display = "flex";
  if (page === "main")   renderMain();
  if (page === "input")  renderInput();
  if (page === "result") renderResult();
  if (page === "admin")  renderAdmin();
}

function renderAll() {
  if (activePage === "main")   renderMain();
  if (activePage === "result") renderResult();
  if (activePage === "admin")  renderAdmin();
}

/* ══════════════════════════════════════════════════════════════════════
   LOGIN
══════════════════════════════════════════════════════════════════════ */
window.doLogin = function() {
  const name = document.getElementById("loginName").value.trim();
  const pin  = document.getElementById("loginPin").value.trim();
  if (!name) { showToast("名前を入力してください"); return; }
  if (!pin)  { showToast("PINを入力してください"); return; }
  if (pin !== (config.userPin || "1234")) {
    showToast("PINが違います");
    document.getElementById("loginPin").value = "";
    return;
  }
  currentUser = { name, isAdmin: false };
  sessionStorage.setItem("sbcUser", JSON.stringify(currentUser));

  // members に未登録なら追加
  const existing = Object.entries(members).find(([,m]) => m.name === name);
  if (!existing) {
    push(gRef("members"), { name, lastInputAt: null, lastInputBy: null });
  }
  showPage("main");
};

window.doAdminLogin = function() {
  const pin = document.getElementById("adminPin").value.trim();
  if (pin !== (config.adminPin || "1234")) {
    showToast("管理者PINが違います");
    document.getElementById("adminPin").value = "";
    return;
  }
  currentUser = { name: "管理者", isAdmin: true };
  sessionStorage.setItem("sbcUser", JSON.stringify(currentUser));
  showPage("admin");
};

window.doLogout = function() {
  sessionStorage.removeItem("sbcUser");
  currentUser = null;
  document.getElementById("loginName").value = "";
  document.getElementById("loginPin").value  = "";
  showPage("login");
};

/* ══════════════════════════════════════════════════════════════════════
   MAIN PAGE
══════════════════════════════════════════════════════════════════════ */
function renderMain() {
  if (!currentUser) return;

  // 予算 vs 支出
  const budget = Number(config.budget) || 0;
  const totalSpent = Object.values(payments).reduce((s, p) => s + Number(p.amount||0), 0);
  const pct = budget > 0 ? Math.min(100, Math.round(totalSpent / budget * 100)) : 0;
  const remaining = budget - totalSpent;
  const barColor = pct >= 100 ? "var(--danger)" : pct >= 80 ? "var(--warn)" : "var(--success)";

  document.getElementById("budgetSection").innerHTML = `
    <div class="budget-row">
      <span class="budget-label">予算</span>
      <span class="budget-val">¥${budget.toLocaleString()}</span>
    </div>
    <div class="budget-row">
      <span class="budget-label">支出合計</span>
      <span class="budget-val" style="color:${barColor}">¥${totalSpent.toLocaleString()}</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" style="width:${pct}%;background:${barColor}"></div>
    </div>
    <div class="budget-row" style="margin-top:4px">
      <span class="budget-label" style="font-size:11px;color:var(--text3)">${pct}% 消費</span>
      <span class="budget-label" style="font-size:11px;color:${remaining<0?'var(--danger)':'var(--text2)'}">
        ${remaining >= 0 ? '残り ¥' + remaining.toLocaleString() : '超過 ¥' + Math.abs(remaining).toLocaleString()}
      </span>
    </div>
  `;

  // メンバー一覧と最終入力日時
  const memberList = Object.entries(members).sort((a,b) => {
    const ta = a[1].lastInputAt || 0, tb = b[1].lastInputAt || 0;
    return tb - ta;
  });

  let memberHtml = "";
  memberList.forEach(([id, m]) => {
    const myTotal = Object.values(payments)
      .filter(p => p.paidBy === m.name)
      .reduce((s,p) => s + Number(p.amount||0), 0);
    const lastAt = m.lastInputAt
      ? `<span class="member-time">${fmtDateTime(m.lastInputAt)}</span>${m.lastInputBy && m.lastInputBy !== m.name ? `<span class="member-inputby">（${m.lastInputBy}が入力）</span>` : ""}`
      : `<span class="member-time" style="color:var(--text3)">未入力</span>`;
    const isMe = m.name === currentUser.name;
    memberHtml += `
      <div class="member-row ${isMe ? 'member-row-me' : ''}">
        <div class="member-avatar" style="background:${avatarBg(m.name)};color:${avatarFg(m.name)}">${initials(m.name)}</div>
        <div class="member-info">
          <div class="member-name">${esc(m.name)}${isMe ? ' <span class="me-badge">自分</span>' : ''}</div>
          <div class="member-sub">${lastAt}</div>
        </div>
        <div class="member-amount">¥${myTotal.toLocaleString()}</div>
      </div>
    `;
  });
  document.getElementById("memberList").innerHTML = memberList.length
    ? memberHtml
    : '<div style="color:var(--text3);font-size:13px;padding:12px 0">メンバーがいません</div>';

  document.getElementById("currentUserName").textContent = currentUser.name;
}

/* ══════════════════════════════════════════════════════════════════════
   INPUT PAGE
══════════════════════════════════════════════════════════════════════ */
window.openInput = function(paymentId = null) {
  editPaymentId = paymentId;
  renderInput();
  showPage("input");
};

function renderInput() {
  if (!currentUser) return;
  const cats = config.categories || ["その他"];
  const catOpts = cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");

  // 支払い者（自分 or 代行）
  const memberOpts = Object.values(members).map(m =>
    `<option value="${esc(m.name)}" ${m.name===currentUser.name?'selected':''}>${esc(m.name)}</option>`
  ).join("");

  let editing = null;
  if (editPaymentId && payments[editPaymentId]) editing = payments[editPaymentId];

  document.getElementById("inputForm").innerHTML = `
    <div class="form-group">
      <label class="form-label">支払い者</label>
      <select class="form-select" id="fPaidBy">${memberOpts}</select>
      ${currentUser.name !== (editing?.paidBy||currentUser.name) ? '' : ''}
    </div>
    <div class="form-group">
      <label class="form-label">カテゴリ</label>
      <select class="form-select" id="fCat" onchange="toggleFNote()">${catOpts}</select>
    </div>
    <div class="form-group" id="fNoteGroup">
      <label class="form-label">メモ</label>
      <input class="form-input" type="text" id="fNote" placeholder="内容を入力（任意）" maxlength="30" value="${esc(editing?.note||'')}">
    </div>
    <div class="form-group">
      <label class="form-label">金額（円）</label>
      <div class="amount-wrap">
        <input class="form-input amount-input" type="text" inputmode="numeric" id="fAmount"
          placeholder="0" maxlength="9" oninput="validateFAmount(this)" value="${editing?.amount||''}">
        <span class="yen-suffix">円</span>
      </div>
      <div class="err-msg" id="fAmountErr">半角数字のみ入力できます</div>
    </div>
    <div class="form-group">
      <label class="form-label">日付</label>
      <input class="form-input" type="date" id="fDate" value="${editing?.date||todayStr()}">
    </div>
    ${editing ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">入力者: ${esc(editing.inputBy||'')} / ${editing.inputAt ? fmtDateTime(editing.inputAt) : ''}</div>` : ''}
  `;
  if (editing) {
    document.getElementById("fPaidBy").value = editing.paidBy || currentUser.name;
    document.getElementById("fCat").value    = editing.category || cats[0];
    toggleFNote();
  }
  document.getElementById("inputTitle").textContent = editing ? "支払いを編集" : "支払いを追加";
  document.getElementById("deleteBtn").style.display = editing ? "flex" : "none";
}

window.toggleFNote = function() {
  const cat = document.getElementById("fCat")?.value;
  const grp = document.getElementById("fNoteGroup");
  if (grp) grp.style.display = "block"; // 常に表示
};

window.validateFAmount = function(el) {
  const raw = el.value, inv = raw.replace(/[0-9]/g, "");
  const errEl = document.getElementById("fAmountErr");
  if (inv.length > 0) {
    el.classList.add("error");
    errEl.classList.add("show");
    el.value = raw.replace(/[^0-9]/g, "");
  } else {
    el.classList.remove("error");
    errEl.classList.remove("show");
  }
};

window.submitPayment = async function() {
  const paidBy   = document.getElementById("fPaidBy").value;
  const category = document.getElementById("fCat").value;
  const note     = document.getElementById("fNote").value.trim();
  const amountRaw= document.getElementById("fAmount").value.trim();
  const date     = document.getElementById("fDate").value;

  if (!amountRaw || !/^[0-9]+$/.test(amountRaw)) {
    showToast("金額を正しく入力してください"); return;
  }
  const amount = parseInt(amountRaw);
  if (amount <= 0) { showToast("1円以上を入力してください"); return; }

  const now = Date.now();
  const payload = { paidBy, category, note, amount, date, inputBy: currentUser.name, inputAt: now };

  if (editPaymentId) {
    await update(gRef(`payments/${editPaymentId}`), payload);
    showToast("支払いを更新しました");
  } else {
    await push(gRef("payments"), payload);
    showToast("支払いを追加しました");
  }

  // メンバーの最終入力日時を更新
  const memberEntry = Object.entries(members).find(([,m]) => m.name === paidBy);
  if (memberEntry) {
    await update(gRef(`members/${memberEntry[0]}`), { lastInputAt: now, lastInputBy: currentUser.name });
  }

  editPaymentId = null;
  showPage("main");
};

window.deletePayment = async function() {
  if (!editPaymentId) return;
  if (!confirm("この支払いを削除しますか？")) return;
  await remove(gRef(`payments/${editPaymentId}`));
  showToast("削除しました");
  editPaymentId = null;
  showPage("main");
};

window.cancelInput = function() {
  editPaymentId = null;
  showPage("main");
};

/* ══════════════════════════════════════════════════════════════════════
   HISTORY PAGE
══════════════════════════════════════════════════════════════════════ */
window.openHistory = function() {
  renderHistory();
  showPage("history");
};

function renderHistory() {
  const sorted = Object.entries(payments).sort((a,b) => (b[1].inputAt||0) - (a[1].inputAt||0));
  if (sorted.length === 0) {
    document.getElementById("historyList").innerHTML =
      '<div style="text-align:center;color:var(--text3);padding:40px 0;font-size:14px">支払い記録がありません</div>';
    return;
  }
  // 日付ごとにグループ化
  const byDate = {};
  sorted.forEach(([id, p]) => {
    const d = p.date || "不明";
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push([id, p]);
  });

  let html = "";
  Object.entries(byDate).sort((a,b) => b[0].localeCompare(a[0])).forEach(([date, list]) => {
    const dayTotal = list.reduce((s,[,p]) => s + Number(p.amount||0), 0);
    html += `<div class="hist-date-header">${fmtDate(date)} <span style="margin-left:auto;font-size:13px">小計 ¥${dayTotal.toLocaleString()}</span></div>`;
    list.forEach(([id, p]) => {
      html += `
        <div class="hist-item" onclick="openInput('${id}')">
          <div class="hist-item-left">
            <div class="member-avatar sm" style="background:${avatarBg(p.paidBy)};color:${avatarFg(p.paidBy)}">${initials(p.paidBy)}</div>
            <div>
              <div class="hist-item-title">${esc(p.category)}${p.note ? ' · ' + esc(p.note) : ''}</div>
              <div class="hist-item-sub">${esc(p.paidBy)}${p.inputBy !== p.paidBy ? ' <span class="proxy-badge">代行:'+esc(p.inputBy)+'</span>' : ''} · ${p.inputAt ? fmtDateTime(p.inputAt) : ''}</div>
            </div>
          </div>
          <div class="hist-item-amount">¥${Number(p.amount).toLocaleString()}</div>
        </div>
      `;
    });
  });
  document.getElementById("historyList").innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════════════
   RESULT PAGE
══════════════════════════════════════════════════════════════════════ */
function renderResult() {
  const memberNames = [...new Set([
    ...Object.values(members).map(m => m.name),
    ...Object.values(payments).map(p => p.paidBy)
  ])].filter(Boolean);

  if (memberNames.length === 0) {
    document.getElementById("resultContent").innerHTML =
      '<div style="text-align:center;color:var(--text3);padding:40px 0">データがありません</div>';
    return;
  }

  const totals = {};
  memberNames.forEach(n => totals[n] = 0);
  Object.values(payments).forEach(p => {
    if (p.paidBy && totals[p.paidBy] !== undefined) totals[p.paidBy] += Number(p.amount||0);
    else if (p.paidBy) totals[p.paidBy] = Number(p.amount||0);
  });

  const total = Object.values(totals).reduce((s,v) => s+v, 0);
  const n = memberNames.length;
  const per = Math.floor(total / n);
  const remainder = total - per * n;

  // 精算計算
  const balances = memberNames.map(name => ({ name, bal: totals[name] - per }));
  const debtors   = balances.filter(b => b.bal < -0.5).map(b => ({...b, amt: Math.round(-b.bal)}));
  const creditors = balances.filter(b => b.bal >  0.5).map(b => ({...b, amt: Math.round(b.bal)}));
  const transfers = [];
  let di = 0, ci = 0;
  while (di < debtors.length && ci < creditors.length) {
    const d = debtors[di], c = creditors[ci];
    const move = Math.min(d.amt, c.amt);
    if (move > 0) transfers.push({ from: d.name, to: c.name, amt: move });
    d.amt -= move; c.amt -= move;
    if (d.amt === 0) di++; if (c.amt === 0) ci++;
  }

  const remNote = remainder > 0 ? `<span style="font-size:11px;color:var(--text3);margin-left:6px">端数${remainder}円</span>` : "";

  let html = `
    <div class="result-metrics">
      <div class="r-metric"><div class="r-label">支出合計</div><div class="r-val">¥${total.toLocaleString()}</div></div>
      <div class="r-metric"><div class="r-label">1人あたり${remNote}</div><div class="r-val">¥${per.toLocaleString()}</div></div>
      <div class="r-metric"><div class="r-label">移動回数</div><div class="r-val">${transfers.length}回</div></div>
    </div>
    <div class="section-title">支払い内訳</div>
  `;

  memberNames.forEach(name => {
    const diff = totals[name] - per;
    const cls  = diff > 0 ? "over" : diff < 0 ? "under" : "even";
    const sign = diff > 0 ? "+" : "";
    html += `
      <div class="breakdown-row">
        <div class="member-avatar sm" style="background:${avatarBg(name)};color:${avatarFg(name)}">${initials(name)}</div>
        <span class="br-name">${esc(name)}</span>
        <span class="br-paid">¥${totals[name].toLocaleString()}</span>
        <span class="br-diff ${cls}">${sign}${diff.toLocaleString()}</span>
      </div>`;
  });

  html += `<div class="section-title" style="margin-top:16px">お金の移動</div>`;
  if (transfers.length === 0) {
    html += `<div class="no-transfer">✅ 全員均等です。移動なし</div>`;
  } else {
    transfers.forEach(t => {
      html += `
        <div class="transfer-row">
          <div class="member-avatar sm" style="background:${avatarBg(t.from)};color:${avatarFg(t.from)}">${initials(t.from)}</div>
          <div class="t-arrow-wrap">
            <div class="t-amount">¥${t.amt.toLocaleString()}</div>
            <div class="t-line"></div>
          </div>
          <div class="member-avatar sm" style="background:${avatarBg(t.to)};color:${avatarFg(t.to)}">${initials(t.to)}</div>
        </div>`;
    });
  }

  // シェアテキスト
  const shareLines = [
    "[Split-bill-calc]",
    `合計: ¥${total.toLocaleString()}  1人あたり: ¥${per.toLocaleString()}`,
    "",
    "■ 内訳",
    ...memberNames.map(n => `  ${n}：¥${totals[n].toLocaleString()}`),
    "",
    "■ お金の移動",
    ...(transfers.length === 0
      ? ["  移動なし"]
      : transfers.map(t => `  ${t.from} → ${t.to}：¥${t.amt.toLocaleString()}`))
  ].join("\n");
  document.getElementById("shareTextArea").value = shareLines;

  document.getElementById("resultContent").innerHTML = html;
}

window.copyShare = async function() {
  const text = document.getElementById("shareTextArea").value;
  try { await navigator.clipboard.writeText(text); showToast("✅ コピーしました！"); }
  catch { showToast("コピーに失敗しました"); }
};

/* ══════════════════════════════════════════════════════════════════════
   ADMIN PAGE
══════════════════════════════════════════════════════════════════════ */
function renderAdmin() {
  // 予算
  document.getElementById("adminBudget").value = config.budget || 0;

  // PIN
  document.getElementById("adminUserPin").value  = "";
  document.getElementById("adminAdminPin").value = "";

  // カテゴリ
  const cats = config.categories || [];
  document.getElementById("catList").innerHTML = cats.map((c, i) =>
    `<div class="cat-row">
      <input class="form-input cat-input" type="text" value="${esc(c)}" id="cat_${i}" maxlength="15">
      <button class="icon-btn danger" onclick="removeCat(${i})">✕</button>
    </div>`
  ).join("");

  // メンバー
  const mList = Object.entries(members);
  document.getElementById("adminMemberList").innerHTML = mList.length ? mList.map(([id, m]) =>
    `<div class="cat-row">
      <span style="flex:1;font-size:14px">${esc(m.name)}</span>
      <button class="icon-btn danger" onclick="removeMember('${id}','${esc(m.name)}')">削除</button>
    </div>`
  ).join("") : '<div style="color:var(--text3);font-size:13px">メンバーなし</div>';
}

window.saveBudget = async function() {
  const v = parseInt(document.getElementById("adminBudget").value) || 0;
  await update(gRef("config"), { budget: v });
  showToast("予算を保存しました");
};

window.saveUserPin = async function() {
  const v = document.getElementById("adminUserPin").value.trim();
  if (!v || v.length < 4) { showToast("4文字以上のPINを入力してください"); return; }
  await update(gRef("config"), { userPin: v });
  showToast("ユーザーPINを変更しました");
  document.getElementById("adminUserPin").value = "";
};

window.saveAdminPin = async function() {
  const v = document.getElementById("adminAdminPin").value.trim();
  if (!v || v.length < 4) { showToast("4文字以上のPINを入力してください"); return; }
  await update(gRef("config"), { adminPin: v });
  showToast("管理者PINを変更しました");
  document.getElementById("adminAdminPin").value = "";
};

window.saveCats = async function() {
  const cats = config.categories || [];
  const newCats = cats.map((_, i) => document.getElementById(`cat_${i}`)?.value.trim()).filter(Boolean);
  await update(gRef("config"), { categories: newCats });
  showToast("カテゴリを保存しました");
};

window.addCat = async function() {
  const inp = document.getElementById("newCatInput");
  const val = inp.value.trim();
  if (!val) { showToast("カテゴリ名を入力してください"); return; }
  const cats = [...(config.categories || []), val];
  await update(gRef("config"), { categories: cats });
  inp.value = "";
  showToast(`「${val}」を追加しました`);
};

window.removeCat = async function(idx) {
  const cats = [...(config.categories || [])];
  cats.splice(idx, 1);
  await update(gRef("config"), { categories: cats });
};

window.removeMember = async function(id, name) {
  if (!confirm(`「${name}」を削除しますか？支払いデータは残ります。`)) return;
  await remove(gRef(`members/${id}`));
  showToast(`「${name}」を削除しました`);
};

window.clearAllPayments = async function() {
  if (!confirm("全ての支払いデータを削除しますか？この操作は元に戻せません。")) return;
  await remove(gRef("payments"));
  showToast("支払いデータを全削除しました");
};

window.adminLogout = function() {

  currentUser = null;
  showPage("login");
};

/* ══════════════════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════════════════ */
const AVATAR_PALETTE = [
  ["#EEF2FF","#4338CA"],["#ECFDF5","#065F46"],["#FFF7ED","#9A3412"],
  ["#FDF2F8","#9D174D"],["#EFF6FF","#1E40AF"],["#F0FDF4","#166534"],
  ["#FFFBEB","#92400E"],["#FEF2F2","#991B1B"],["#F5F3FF","#5B21B6"],["#ECFEFF","#155E75"]
];
function avatarIdx(name) {
  let h = 0; for (const c of (name||"")) h = (h * 31 + c.charCodeAt(0)) & 0xff;
  return h % AVATAR_PALETTE.length;
}
function avatarBg(name) { return AVATAR_PALETTE[avatarIdx(name)][0]; }
function avatarFg(name) { return AVATAR_PALETTE[avatarIdx(name)][1]; }
function initials(name) { return (name||"?").slice(0,2); }
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDateTime(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtDate(str) {
  if (!str || str === "不明") return str;
  const [y,m,d] = str.split("-");
  return `${y}年${parseInt(m)}月${parseInt(d)}日`;
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

// expose for inline HTML
window.showPage = showPage;
window.showToast = showToast;
window.openHistory = openHistory;
window.renderHistory = renderHistory;

// start
init();

  <div class="app-header">
    <button class="hdr-btn" onclick="showPage('main')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      戻る
    </button>
    <h2>支払い履歴</h2>
    <div style="width:56px"></div>
  </div>
  <div class="page-body">
    <div id="historyList"></div>
  </div>
</div>

<!-- ══ RESULT ══ -->
<div class="page" id="page-result">
  <div class="app-header">
    <div style="width:56px"></div>
    <h2>集計・精算</h2>
    <div style="width:56px"></div>
  </div>
  <div class="page-body">
    <div class="card">
      <div id="resultContent"></div>
    </div>
    <div class="card">
      <div class="card-title">シェア</div>
      <textarea class="share-area" id="shareTextArea" readonly></textarea>
      <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="copyShare()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        テキストをコピー
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn" onclick="setNavActive(this);showPage('main')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      ホーム
    </button>
    <button class="nav-btn" onclick="setNavActive(this);openHistory()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><path d="M3.05 11a9 9 0 1 0 .5-4"/><path d="M3 3v5h5"/></svg>
      履歴
    </button>
    <button class="nav-btn active" onclick="setNavActive(this);showPage('result')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      集計
    </button>
  </nav>
</div>

<!-- ══ ADMIN ══ -->
<div class="page" id="page-admin">
  <div class="app-header">
    <h2>⚙️ 管理者設定</h2>
    <button class="hdr-btn" onclick="adminLogout()">ログアウト</button>
  </div>
  <div class="page-body">

    <!-- 予算 -->
    <div class="admin-section">
      <div class="admin-section-title">💰 全体予算</div>
      <div class="form-group">
        <label class="form-label">予算金額（円）</label>
        <input class="form-input" type="text" inputmode="numeric" id="adminBudget" placeholder="0">
      </div>
      <button class="btn btn-success btn-sm" onclick="saveBudget()">予算を保存</button>
    </div>

    <!-- カテゴリ -->
    <div class="admin-section">
      <div class="admin-section-title">🏷 カテゴリ管理</div>
      <div id="catList"></div>
      <div class="add-cat-row">
        <input class="form-input add-cat-input" type="text" id="newCatInput" placeholder="新しいカテゴリ名" maxlength="15"
          onkeydown="if(event.key==='Enter')addCat()">
        <button class="icon-btn" onclick="addCat()">＋ 追加</button>
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="saveCats()">カテゴリを保存</button>
    </div>

    <!-- PIN -->
    <div class="admin-section">
      <div class="admin-section-title">🔑 PIN設定</div>
      <div class="form-group">
        <label class="form-label">ユーザーPIN（変更）</label>
        <input class="form-input" type="password" id="adminUserPin" placeholder="新しいPIN（4文字以上）" maxlength="20">
        <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="saveUserPin()">ユーザーPINを変更</button>
      </div>
      <div class="form-group">
        <label class="form-label" style="color:var(--danger)">管理者PIN（変更）</label>
        <input class="form-input" type="password" id="adminAdminPin" placeholder="新しい管理者PIN（4文字以上）" maxlength="20">
        <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="saveAdminPin()">管理者PINを変更</button>
      </div>
    </div>

    <!-- メンバー -->
    <div class="admin-section">
      <div class="admin-section-title">👥 メンバー管理</div>
      <div id="adminMemberList"></div>
    </div>

    <!-- データ -->
    <div class="admin-section">
      <div class="admin-section-title" style="color:var(--danger)">⚠️ データ管理</div>
      <button class="btn btn-danger btn-sm" onclick="clearAllPayments()">全支払いデータを削除</button>
    </div>

    <div style="height:32px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function setNavActive(btn) {
  btn.closest('nav').querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
